apiVersion: v1
kind: ConfigMap
metadata:
  name: httpd-index-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Simple HTTPD</title></head>
    <body>
      <h1>Ini tampilan dari HTTPD dan nama saya Jahfal Uno Surya Lazuardi</h1>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-httpd
  namespace: default
  labels:
    app: simple-httpd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-httpd
  template:
    metadata:
      labels:
        app: simple-httpd
    spec:
      containers:
      - name: httpd
        image: httpd:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/local/apache2/htdocs/index.html
          subPath: index.html
      volumes:
      - name: html-volume
        configMap:
          name: httpd-index-html
---
apiVersion: v1
kind: Service
metadata:
  name: simple-httpd-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: simple-httpd
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081